spring:
  application:
    name: gateway

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  main:
    web-application-type: reactive

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/vermeg-realm}

  cloud:
    gateway:
      routes:
        - id: api-product-service
          uri: lb://GESTIONPRODUIT
          predicates:
            - Path=/api/produits/**,/api/packs/**,/api/garanties/**

        - id: api-chatbot-service
          uri: http://chatbot-service:9001
          predicates:
            - Path=/api/chatbot/**

        - id: api-recommendation-service
          uri: lb://GESTIONRECOMMENDATION
          predicates:
            - Path=/api/recommendations/**

      globalcors:
        cors-configurations:
          "[/**]":
            allowed-origins: "http://localhost:4200"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true

  # Actuator Configuration
  management:
    endpoints:
      web:
        exposure:
          include: "*"
    endpoint:
      health:
        show-details: always
      metrics:
        enabled: true
      prometheus:
        enabled: true
    metrics:
      export:
        prometheus:
          enabled: true
      tags:
        application: ${spring.application.name}
        environment: ${spring.profiles.active:local}

server:
  port: 9091

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka:8761/eureka}
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO

---
spring:
  config:
    activate:
      on-profile: docker

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/vermeg-realm

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka
  instance:
    prefer-ip-address: false
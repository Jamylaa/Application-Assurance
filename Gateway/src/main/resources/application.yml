spring:
  application:
    name: gateway

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  main:
    web-application-type: reactive

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/vermeg-realm}

  cloud:
    gateway:
      routes:
        - id: api-product-service
          uri: lb://GESTIONPRODUIT
          predicates:
            - Path=/api/produits/**,/api/packs/**,/api/garanties/**

        - id: api-chatbot-service
          uri: http://chatbot-service:9001
          predicates:
            - Path=/api/chatbot/**

      globalcors:
        cors-configurations:
          "[/**]":
            allowed-origins: "http://localhost:4200"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true

# Actuator Configuration — clé de premier niveau (pas sous spring:), sinon Spring Boot
# ne la lie pas et retombe sur ses valeurs par défaut. Exposition restreinte : le
# Gateway est exposé publiquement (Service LoadBalancer), "*" exposerait /env,
# /heapdump, /threaddump, /beans au trafic externe.
management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: when-authorized
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:local}

server:
  port: 9091

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka:8761/eureka}
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO

---
spring:
  config:
    activate:
      on-profile: docker

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/vermeg-realm

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka
  instance:
    prefer-ip-address: false
<div [ngSwitch]="type">
  <!-- Text Skeleton -->
  <ng-container *ngSwitchCase="'text'">
    <div *ngFor="let i of skeletons" class="skeleton skeleton-text" [style.width]="width" [style.height]="height"></div>
  </ng-container>

  <!-- Circle Skeleton -->
  <ng-container *ngSwitchCase="'circle'">
    <div class="skeleton skeleton-circle" [style.width]="height" [style.height]="height"></div>
  </ng-container>

  <!-- Card Skeleton -->
  <ng-container *ngSwitchCase="'card'">
    <div class="skeleton skeleton-card">
      <div class="skeleton skeleton-text" style="height: 24px; margin-bottom: 12px;"></div>
      <div class="skeleton skeleton-text" style="height: 32px; margin-bottom: 8px;"></div>
      <div class="skeleton skeleton-text" style="height: 16px; width: 80%;"></div>
    </div>
  </ng-container>

  <!-- Table Skeleton -->
  <ng-container *ngSwitchCase="'table'">
    <div class="skeleton-table">
      <!-- Table Header -->
      <div class="skeleton-table-row header">
        <div class="skeleton skeleton-text" style="flex: 1; height: 20px;"></div>
        <div class="skeleton skeleton-text" style="flex: 1; height: 20px;"></div>
        <div class="skeleton skeleton-text" style="flex: 1; height: 20px;"></div>
        <div class="skeleton skeleton-text" style="flex: 1; height: 20px;"></div>
      </div>
      <!-- Table Rows -->
      <div *ngFor="let i of [1,2,3,4,5]" class="skeleton-table-row">
        <div class="skeleton skeleton-text" style="flex: 1; height: 16px;"></div>
        <div class="skeleton skeleton-text" style="flex: 1; height: 16px;"></div>
        <div class="skeleton skeleton-text" style="flex: 1; height: 16px;"></div>
        <div class="skeleton skeleton-text" style="flex: 1; height: 16px;"></div>
      </div>
    </div>
  </ng-container>

  <!-- Chart Skeleton -->
  <ng-container *ngSwitchCase="'chart'">
    <div class="skeleton-chart">
      <div class="chart-bars">
        <div *ngFor="let i of [1,2,3,4,5,6,7,8]" class="chart-bar">
          <div class="skeleton skeleton-bar" [style.height.%]="40 + (i * 8)"></div>
        </div>
      </div>
      <div class="chart-labels">
        <div *ngFor="let i of [1,2,3,4,5,6,7,8]" class="skeleton skeleton-text" style="height: 12px; flex: 1;"></div>
      </div>
    </div>
  </ng-container>
</div>

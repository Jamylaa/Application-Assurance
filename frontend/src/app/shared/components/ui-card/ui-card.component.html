<div
  class="ui-card {{ getPaddingClass() }} {{ getShadowClass() }}"
  [class.clickable]="clickable"
  [class.hoverable]="hoverable"
  (click)="onCardClick()"
  (mouseenter)="onCardHover(true)"
  (mouseleave)="onCardHover(false)"
>
  <!-- Loading State -->
  <div *ngIf="loading" class="card-loading">
    <div class="loading-spinner"></div>
    <p class="loading-text">Chargement...</p>
  </div>

  <!-- Card Header -->
  <div *ngIf="title || subtitle || icon" class="card-header">
    <div *ngIf="icon" class="card-icon-wrapper">
      <i [class]="'bi ' + icon" [ngClass]="getIconClass()"></i>
    </div>
    <div class="card-title-wrapper">
      <h3 *ngIf="title" class="card-title">{{ title }}</h3>
      <p *ngIf="subtitle" class="card-subtitle">{{ subtitle }}</p>
    </div>
  </div>

  <!-- Card Content -->
  <div class="card-content">
    <ng-content></ng-content>
  </div>

  <!-- Card Footer -->
  <div class="card-footer">
    <ng-content select="[card-footer]"></ng-content>
  </div>
</div>

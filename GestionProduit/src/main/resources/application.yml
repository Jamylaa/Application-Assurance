spring:
  application:
    name: gestionProduit

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  cloud:
    config:
      enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/vermeg-realm}

# Actuator Configuration — clé de premier niveau (pas sous spring:), sinon Spring Boot
# ne la lie pas et retombe sur ses valeurs par défaut. Exposition restreinte aux
# endpoints nécessaires (santé pour les probes k8s, prometheus pour le scraping),
# plutôt que "*" qui exposerait aussi /env, /heapdump, /threaddump, /beans.
management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: when-authorized
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:local}

server:
  port: 9093
web:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework: INFO
    org.hibernate: INFO
    com.zaxxer.hikari: INFO
    org.springframework.web: INFO
    org.springframework.web.servlet.mvc.method.annotation: INFO

---
spring:
  config:
    activate:
      on-profile: docker

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://admin:password@mongodb:27017/vermeg_db?authSource=admin}
      database: ${MONGODB_DATABASE:vermeg_db}

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka
  instance:
    prefer-ip-address: false

---
spring:
  config:
    activate:
      on-profile: local

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://admin:password@localhost:27017/vermeg_db?authSource=admin}
      database: ${MONGODB_DATABASE:vermeg_db}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

---
# staging/prod : aucune valeur par défaut sur MONGODB_URI/EUREKA_CLIENT_SERVICEURL_DEFAULTZONE/
# CORS_ALLOWED_ORIGINS/KEYCLOAK_ISSUER_URI (contrairement à local/docker) — un déploiement réel
# n'a pas de "localhost" de secours sensé, donc on préfère un échec au démarrage (placeholder
# non résolu) à un pointage silencieux vers le mauvais hôte.
spring:
  config:
    activate:
      on-profile: staging

  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:vermeg_db}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
  instance:
    prefer-ip-address: true

web:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    org.springframework.security: INFO
    org.springframework: INFO
    org.hibernate: INFO
    com.zaxxer.hikari: INFO

---
spring:
  config:
    activate:
      on-profile: prod

  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:vermeg_db}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
  instance:
    prefer-ip-address: true

web:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    org.springframework.security: WARN
    org.springframework: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN

management:
  endpoint:
    health:
      show-details: never


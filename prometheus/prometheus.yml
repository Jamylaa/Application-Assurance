global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'vermeg-monitor'

# Règles d'alerte (chargées au démarrage, évaluées toutes les evaluation_interval).
rule_files:
  - alerts.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API Gateway
  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway:9091']
        labels:
          service: 'gateway'
          application: 'api-gateway'

  # Gestion Produit
  - job_name: 'gestionproduit'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gestionproduit:9093']
        labels:
          service: 'gestion-produit'
          application: 'gestion-produit'

  # Eureka Server
  - job_name: 'eureka'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['eureka:8761']
        labels:
          service: 'eureka'
          application: 'eureka-server'

  # Chatbot Service (instrumenté via prometheus-fastapi-instrumentator)
  - job_name: 'chatbot-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['chatbot-service:9001']
        labels:
          service: 'chatbot-service'
          application: 'chatbot-service'

services:
  # MongoDB
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: vermeg_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - vermeg-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.5
    container_name: keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "9090:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - vermeg-network
    restart: unless-stopped
    healthcheck:
      # curl/wget absents de l'image Keycloak : vérification via /dev/tcp (bash),
      # sur le port 9000 (interface de management, distincte du port 8080 applicatif).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && timeout 2 cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Eureka Server
  eureka:
    build:
      context: ./Eureka
      dockerfile: Dockerfile
    container_name: eureka
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - vermeg-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # API Gateway
  gateway:
    build:
      context: ./Gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "9091:9091"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/vermeg-realm/protocol/openid-connect/certs
    networks:
      - vermeg-network
    depends_on:
      eureka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Gestion Produit
  gestionproduit:
    build:
      context: ./GestionProduit
      dockerfile: Dockerfile
    container_name: gestionproduit
    ports:
      - "9093:9093"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-password}@mongodb:27017/vermeg_db?authSource=admin
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/vermeg-realm/protocol/openid-connect/certs
    networks:
      - vermeg-network
    depends_on:
      mongodb:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9093/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s

  # Chatbot Service (Python FastAPI)
  chatbot-service:
    build:
      context: ./chatbot-service
      dockerfile: Dockerfile
    container_name: chatbot-service
    ports:
      - "9001:9001"
    env_file:
      - ./chatbot-service/.env
    networks:
      - vermeg-network
    depends_on:
      gestionproduit:
        condition: service_healthy
    restart: unless-stopped
    # HEALTHCHECK deja defini dans chatbot-service/Dockerfile — pas de doublon ici.

  # Frontend Angular
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "4200:80"
    environment:
      - NODE_ENV=production
    networks:
      - vermeg-network
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 explicite : "localhost" resout en ::1 (IPv6) sur cette image
      # Alpine/musl, alors que nginx n'ecoute qu'en IPv4.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

# Networks
networks:
  vermeg-network:
    driver: bridge

# Volumes
volumes:
  mongodb_data:
    driver: local
  keycloak_data:
    driver: local
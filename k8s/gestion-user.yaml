apiVersion: v1
kind: ConfigMap
metadata:
  name: gestion-user-config
  namespace: vermeg-assurance
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/vermeg-user"
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka:8761/eureka"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestion-user
  namespace: vermeg-assurance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gestion-user
  template:
    metadata:
      labels:
        app: gestion-user
    spec:
      containers:
      - name: gestion-user
        image: vermeg/gestion-user:latest
        ports:
        - containerPort: 9092
        envFrom:
        - configMapRef:
            name: gestion-user-config
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 9092
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 9092
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gestion-user
  namespace: vermeg-assurance
spec:
  selector:
    app: gestion-user
  ports:
  - port: 9092
    targetPort: 9092
  type: ClusterIP

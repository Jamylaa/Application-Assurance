apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestionproduit
  namespace: vermeg-assurance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gestionproduit
  template:
    metadata:
      labels:
        app: gestionproduit
    spec:
      containers:
      - name: gestionproduit
        image: vermeg-assurance-backend:latest
        ports:
        - containerPort: 8083
        env:
        - name: SPRING_DATA_MONGODB_URI
          value: "mongodb://mongodb:27017/vermeg_assurance"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: SPRING_REDIS_HOST
          value: "redis"
        - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          value: "http://eureka:8761/eureka/"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gestionproduit
  namespace: vermeg-assurance
spec:
  selector:
    app: gestionproduit
  ports:
  - protocol: TCP
    port: 8083
    targetPort: 8083
  type: ClusterIP

# HorizontalPodAutoscaler — mise à l'échelle automatique selon CPU/mémoire.
# Cible les services stateless. Eureka (registre de services) est volontairement exclu :
# on garde un nombre fixe d'instances de registre.
# Prérequis cluster : metrics-server installé (fournit les métriques CPU/mémoire).
# Prérequis manifests : chaque Deployment ciblé définit des resources.requests (OK ici).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gestionproduit
  namespace: vermeg-assurance
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gestionproduit
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # évite le "flapping" : attend 5 min avant de réduire

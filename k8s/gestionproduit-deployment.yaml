apiVersion: v1
kind: Service
metadata:
  name: gestionproduit
  namespace: vermeg-assurance
  labels:
    app: gestionproduit
spec:
  ports:
  - port: 9093
    name: http
  selector:
    app: gestionproduit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestionproduit
  namespace: vermeg-assurance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gestionproduit
  template:
    metadata:
      labels:
        app: gestionproduit
    spec:
      containers:
      - name: gestionproduit
        image: vermeg-gestionproduit:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9093
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: vermeg-config
              key: SPRING_PROFILES_ACTIVE
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: vermeg-config
              key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        - name: SPRING_DATA_MONGODB_URI
          valueFrom:
            configMapKeyRef:
              name: vermeg-config
              key: MONGODB_URI
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx1024m"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 9093
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 9093
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 9093
          initialDelaySeconds: 30
          periodSeconds: 10

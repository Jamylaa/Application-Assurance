apiVersion: v1
kind: Secret
metadata:
  name: vermeg-secrets
  namespace: vermeg-assurance
type: Opaque
stringData:
  # MongoDB Credentials
  MONGO_INITDB_ROOT_USERNAME: "admin"
  MONGO_INITDB_ROOT_PASSWORD: "password"
  
  # Keycloak Credentials
  KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
  KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
  
  # JWT Secret (should be set via kubectl create secret or sealed-secrets)
  JWT_SECRET: "your-jwt-secret-here"
  
  # Google API Key (should be set via kubectl create secret or sealed-secrets)
  GOOGLE_API_KEY: "your-google-api-key-here"

  # GitHub Models API Key for chatbot-service (should be set via kubectl create secret or sealed-secrets)
  GITHUB_API_KEY: "your-github-pat-here"

  # Mail Configuration
  MAIL_USERNAME: "your-email@gmail.com"
  MAIL_PASSWORD: "your-app-password"

  # Grafana Admin Credentials
  GRAFANA_ADMIN_USER: "admin"
  GRAFANA_ADMIN_PASSWORD: "admin"

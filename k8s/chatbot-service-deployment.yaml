apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
  namespace: vermeg-assurance
  labels:
    app: chatbot-service
spec:
  ports:
  - port: 9001
    name: http
  selector:
    app: chatbot-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-service
  namespace: vermeg-assurance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot-service
  template:
    metadata:
      labels:
        app: chatbot-service
    spec:
      containers:
      - name: chatbot-service
        image: vermeg-chatbot-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9001
          name: http
        env:
        - name: SPRING_BOOT_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: vermeg-config
              key: SPRING_BOOT_BASE_URL
        - name: GITHUB_MODEL
          valueFrom:
            configMapKeyRef:
              name: vermeg-config
              key: GITHUB_MODEL
        - name: GITHUB_URL
          valueFrom:
            configMapKeyRef:
              name: vermeg-config
              key: GITHUB_URL
        - name: GITHUB_ENABLED
          value: "true"
        - name: AI_EXTRACTION_ENABLED
          value: "true"
        - name: FALLBACK_ON_AI_ERROR
          value: "true"
        - name: CORS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: vermeg-config
              key: CORS_ALLOWED_ORIGINS
        - name: GITHUB_API_KEY
          valueFrom:
            secretKeyRef:
              name: vermeg-secrets
              key: GITHUB_API_KEY
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/chatbot/health
            port: 9001
          initialDelaySeconds: 20
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/chatbot/health
            port: 9001
          initialDelaySeconds: 10
          periodSeconds: 10

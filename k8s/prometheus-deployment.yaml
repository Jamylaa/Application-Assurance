apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: vermeg-assurance
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'gateway'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['gateway:9091']
      - job_name: 'gestionproduit'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['gestionproduit:9093']
      - job_name: 'eureka'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['eureka:8761']
  # Règles d'alerte (miroir de prometheus/alerts.yml). La ConfigMap étant montée sur
  # /etc/prometheus/, cette clé apparaît comme /etc/prometheus/alerts.yml (cf. rule_files).
  alerts.yml: |
    groups:
      - name: vermeg-availability
        rules:
          - alert: InstanceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.job }} indisponible"
              description: "La cible {{ $labels.instance }} ne répond plus depuis 1 min."
      - name: vermeg-http
        rules:
          - alert: HighHttpErrorRate
            expr: |
              sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
                / sum by (job) (rate(http_server_requests_seconds_count[5m])) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Taux d'erreurs 5xx élevé sur {{ $labels.job }}"
          - alert: HighRequestLatencyP95
            expr: |
              histogram_quantile(0.95,
                sum by (le, job) (rate(http_server_requests_seconds_bucket[5m]))) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Latence p95 élevée sur {{ $labels.job }}"
      - name: vermeg-resources
        rules:
          - alert: HighJvmHeapUsage
            expr: |
              sum by (job) (jvm_memory_used_bytes{area="heap"})
                / sum by (job) (jvm_memory_max_bytes{area="heap"} > 0) > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Heap JVM > 90% sur {{ $labels.job }}"
          - alert: HighCpuUsage
            expr: process_cpu_usage > 0.8
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "CPU process > 80% sur {{ $labels.job }}"
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: vermeg-assurance
  labels:
    app: prometheus
spec:
  ports:
  - port: 9090
    name: prometheus
  selector:
    app: prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: vermeg-assurance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
          name: prometheus
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/
        - name: prometheus-data
          mountPath: /prometheus
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-data
        emptyDir: {}

# Ingress — point d'entrée HTTP unique du cluster.
#   vermeg.local/api  -> gateway  (qui route ensuite vers gestionproduit / chatbot)
#   vermeg.local/     -> frontend (SPA Angular servie par Nginx)
# Prérequis cluster : un Ingress Controller (ex. ingress-nginx) installé.
# En local (kind), mapper "vermeg.local" vers l'IP du controller dans /etc/hosts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vermeg-ingress
  namespace: vermeg-assurance
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: vermeg.local
    http:
      paths:
      # /api en premier : le préfixe le plus spécifique gagne (routes API via Gateway)
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 9091
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80

name: Frontend CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Run linter
      working-directory: ./frontend
      run: npm run lint --if-present
    
    - name: Run tests
      working-directory: ./frontend
      run: npm test -- --watch=false --browsers=ChromeHeadless
    
    - name: Build Angular app
      working-directory: ./frontend
      run: npm run build -- --configuration production
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist/
    
    - name: Login to Docker Hub
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # IMPORTANT : le nom d'image DOIT être préfixé par le namespace Docker Hub
    # (${{ secrets.DOCKER_USERNAME }}/...). Sans préfixe, Docker résout vers le
    # namespace réservé "library/" (images officielles) et le push est refusé
    # ("denied: requested access to the resource is denied") pour tout compte
    # standard, même authentifié.
    - name: Build Docker image
      if: github.ref == 'refs/heads/main'
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/vermeg-frontend:${{ github.sha }} ./frontend
        docker tag ${{ secrets.DOCKER_USERNAME }}/vermeg-frontend:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/vermeg-frontend:latest

    - name: Push Docker image
      if: github.ref == 'refs/heads/main'
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/vermeg-frontend:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/vermeg-frontend:latest

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/k8s-set-context@v4
      with:
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment/frontend frontend=${{ secrets.DOCKER_USERNAME }}/vermeg-frontend:latest -n vermeg-assurance
        kubectl rollout status deployment/frontend -n vermeg-assurance

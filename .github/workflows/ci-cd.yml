name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/update-microservices-v2 ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Build GestionUser
      working-directory: ./GestionUser
      run: mvn clean install -DskipTests
    
    - name: Build GestionProduit
      working-directory: ./GestionProduit
      run: mvn clean install -DskipTests
    
    - name: Build Gateway
      working-directory: ./Gateway
      run: mvn clean install -DskipTests
    
    - name: Build Eureka
      working-directory: ./Eureka
      run: mvn clean install -DskipTests
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json
    
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build -- --configuration production
    
    - name: Run tests GestionUser
      working-directory: ./GestionUser
      run: mvn test
    
    - name: Run tests GestionProduit
      working-directory: ./GestionProduit
      run: mvn test
    
    - name: Run frontend tests
      working-directory: ./frontend
      run: npm test -- --watch=false --browsers=ChromeHeadless

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push GestionUser
      uses: docker/build-push-action@v5
      with:
        context: ./GestionUser
        push: true
        tags: vermeg/gestion-user:latest
    
    - name: Build and push GestionProduit
      uses: docker/build-push-action@v5
      with:
        context: ./GestionProduit
        push: true
        tags: vermeg/gestion-produit:latest
    
    - name: Build and push Gateway
      uses: docker/build-push-action@v5
      with:
        context: ./Gateway
        push: true
        tags: vermeg/gateway:latest
    
    - name: Build and push Eureka
      uses: docker/build-push-action@v5
      with:
        context: ./Eureka
        push: true
        tags: vermeg/eureka:latest
    
    - name: Build and push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: vermeg/frontend:latest

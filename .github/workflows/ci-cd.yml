name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'
  DOCKER_REGISTRY: docker.io

jobs:
  # ============================================
  # Backend Build and Test
  # ============================================
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build GestionProduit
        run: |
          cd GestionProduit
          mvn clean install -DskipTests

      - name: Run Backend Tests
        run: |
          cd GestionProduit
          mvn test

      - name: Build GestionUser
        run: |
          cd GestionUser
          mvn clean install -DskipTests

      - name: Build Gateway
        run: |
          cd Gateway
          mvn clean install -DskipTests

      - name: Build Eureka
        run: |
          cd Eureka
          mvn clean install -DskipTests

  # ============================================
  # Frontend Build and Test
  # ============================================
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run lint
        run: |
          cd frontend
          npm run lint --if-present

      - name: Run tests
        run: |
          cd frontend
          npm test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Build Angular
        run: |
          cd frontend
          npm run build -- --configuration production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================
  # Docker Build and Push
  # ============================================
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push GestionProduit
        uses: docker/build-push-action@v5
        with:
          context: ./GestionProduit
          file: ./GestionProduit/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vermeg-gestion-produit:latest
            ${{ secrets.DOCKER_USERNAME }}/vermeg-gestion-produit:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/vermeg-gestion-produit:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/vermeg-gestion-produit:buildcache,mode=max

      - name: Build and push GestionUser
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./GestionUser/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vermeg-gestion-user:latest
            ${{ secrets.DOCKER_USERNAME }}/vermeg-gestion-user:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/vermeg-gestion-user:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/vermeg-gestion-user:buildcache,mode=max

      - name: Build and push Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Gateway/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vermeg-gateway:latest
            ${{ secrets.DOCKER_USERNAME }}/vermeg-gateway:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/vermeg-gateway:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/vermeg-gateway:buildcache,mode=max

      - name: Build and push Eureka
        uses: docker/build-push-action@v5
        with:
          context: ./Eureka
          file: ./Eureka/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vermeg-eureka:latest
            ${{ secrets.DOCKER_USERNAME }}/vermeg-eureka:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/vermeg-eureka:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/vermeg-eureka:buildcache,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vermeg-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/vermeg-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/vermeg-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/vermeg-frontend:buildcache,mode=max

  # ============================================
  # Security Scan
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================
  # Kubernetes Deployment
  # ============================================
  k8s-deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://your-app-domain.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure Kubernetes credentials
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/mongodb-statefulset.yaml
          kubectl apply -f k8s/redis-deployment.yaml
          kubectl apply -f k8s/keycloak-deployment.yaml
          kubectl apply -f k8s/eureka-deployment.yaml
          kubectl apply -f k8s/gateway-deployment.yaml
          kubectl apply -f k8s/gestionuser-deployment.yaml
          kubectl apply -f k8s/gestionproduit-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/prometheus-deployment.yaml
          kubectl apply -f k8s/grafana-deployment.yaml

      - name: Wait for deployment
        run: |
          kubectl wait --for=condition=available --timeout=300s deployment/gateway -n vermeg-app
          kubectl wait --for=condition=available --timeout=300s deployment/gestionuser -n vermeg-app
          kubectl wait --for=condition=available --timeout=300s deployment/gestionproduit -n vermeg-app
          kubectl wait --for=condition=available --timeout=300s deployment/frontend -n vermeg-app

      - name: Verify deployment
        run: |
          kubectl get pods -n vermeg-app
          kubectl get services -n vermeg-app

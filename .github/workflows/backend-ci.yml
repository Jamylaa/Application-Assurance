name: Backend CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      working-directory: ./GestionProduit
      run: mvn clean install -DskipTests
    
    - name: Run tests
      working-directory: ./GestionProduit
      run: mvn test
    
    - name: Generate test report
      if: always()
      working-directory: ./GestionProduit
      run: mvn surefire-report:report
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: GestionProduit/target/surefire-reports/
    
    - name: Build Docker image
      if: github.ref == 'refs/heads/main'
      run: |
        docker build -t vermeg-assurance-backend:${{ github.sha }} ./GestionProduit
        docker tag vermeg-assurance-backend:${{ github.sha }} vermeg-assurance-backend:latest
    
    - name: Login to Docker Hub
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Push Docker image
      if: github.ref == 'refs/heads/main'
      run: |
        docker push vermeg-assurance-backend:${{ github.sha }}
        docker push vermeg-assurance-backend:latest

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure kubectl
      uses: azure/k8s-set-context@v4
      with:
        kubeconfig: ${{ secrets.KUBE_CONFIG }}
    
    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment/gestionproduit gestionproduit=vermeg-assurance-backend:latest -n vermeg-assurance
        kubectl rollout status deployment/gestionproduit -n vermeg-assurance

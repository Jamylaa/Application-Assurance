name: Chatbot Service CI/CD

on:
  # feature/** ajouté (comme les autres pipelines) pour tourner sur la branche de
  # travail actuelle. Le filtre paths reste : ce pipeline ne se déclenche que si
  # chatbot-service/ (ou ce workflow) change.
  push:
    branches: [ main, develop, 'feature/**' ]
    paths:
      - 'chatbot-service/**'
      - '.github/workflows/chatbot-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'chatbot-service/**'
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: chatbot-service/requirements.txt

    - name: Install dependencies
      working-directory: ./chatbot-service
      run: pip install -r requirements.txt

    - name: Check syntax (compileall)
      working-directory: ./chatbot-service
      run: python -m compileall -q app main.py

    # Pas de suite pytest à ce jour (limite connue et documentée du projet) :
    # cette étape s'exécute et échoue la build dès qu'une suite sera ajoutée,
    # plutôt que d'échouer silencieusement comme le faisait l'ancien
    # `mvn ... || echo skipped` de ci-cd.yml pour Eureka/Gateway.
    - name: Run tests (pytest, if any)
      working-directory: ./chatbot-service
      run: |
        pip install pytest
        if compgen -G "**/test_*.py" > /dev/null || compgen -G "**/*_test.py" > /dev/null; then
          pytest
        else
          echo "Aucun test pytest présent — étape ignorée (limite connue, cf. rapport)."
        fi

    # IMPORTANT : le nom d'image DOIT être préfixé par le namespace Docker Hub
    # (${{ secrets.DOCKER_USERNAME }}/...), sinon Docker résout vers le namespace
    # réservé "library/" et le push est refusé pour un compte standard.
    - name: Build Docker image
      if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/vermeg-chatbot-service:${{ github.sha }} ./chatbot-service
        docker tag ${{ secrets.DOCKER_USERNAME }}/vermeg-chatbot-service:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/vermeg-chatbot-service:latest

    - name: Login to Docker Hub
      if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker image
      if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/vermeg-chatbot-service:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/vermeg-chatbot-service:latest

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'

    steps:
    - name: Configure kubectl
      uses: azure/k8s-set-context@v4
      with:
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment/chatbot-service chatbot-service=${{ secrets.DOCKER_USERNAME }}/vermeg-chatbot-service:latest -n vermeg-assurance
        kubectl rollout status deployment/chatbot-service -n vermeg-assurance
